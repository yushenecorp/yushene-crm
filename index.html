<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="禹盛客資">
<title>禹盛開發客資系統</title>
<style>
:root{
  --ink:#14181F; --ink-2:#3A424F; --ink-3:#6B7482;
  --paper:#FAFAF8; --card:#FFFFFF; --line:#E5E4DF; --line-2:#F0EFEB;
  --brass:#9C7A3C; --brass-soft:#F5EFE3;
  --s-new:#B0761A;    --s-new-bg:#FBF1DE;
  --s-track:#2B5C8A;  --s-track-bg:#E8F0F7;
  --s-visit:#1E7A5A;  --s-visit-bg:#E4F2EC;
  --s-close:#75798A;  --s-close-bg:#EFEFF2;
  --danger:#A8322A;   --danger-bg:#FBEAE8;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  background:var(--paper); color:var(--ink); min-height:100vh;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}
#busyBar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;
  box-shadow:0 6px 24px rgba(20,24,31,.28);animation:bfade .2s ease}
@keyframes bfade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ---------- 版式 ---------- */
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.hr{height:1px;background:var(--line);margin:20px 0}

/* ---------- 登入 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px}
.mark{width:44px;height:44px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.mark span{font-size:15px;font-weight:700;letter-spacing:.06em}
.login-card h1{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.login-card .sub{color:var(--ink-3);font-size:13px;margin-top:6px;margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);outline:none;transition:border-color .15s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:var(--r);font-weight:600;font-size:14px;
  background:var(--ink);color:#fff;transition:opacity .15s
}
.btn:active{opacity:.8}
.btn:disabled{opacity:.45;cursor:default}
.btn-full{width:100%}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px}
.msg-err{background:var(--danger-bg);color:var(--danger)}
.msg-ok{background:var(--s-visit-bg);color:var(--s-visit)}

/* ---------- 頂列 ---------- */
.top{
  position:sticky;top:0;z-index:20;background:rgba(250,250,248,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)
}
.top-in{max-width:940px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.top-case{font-weight:650;font-size:15px;letter-spacing:-.01em}
.top-case small{display:block;font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.top-sp{flex:1}
.who{font-size:12px;color:var(--ink-3)}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:active{background:var(--line-2)}

/* ---------- 分頁 ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:11px 14px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- 搜尋列 ---------- */
.search-row{display:flex;gap:8px;margin:14px 0 10px}
.search-row input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);outline:none}
.search-row input:focus{border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters select{
  padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  font-size:13px;outline:none;max-width:150px
}
.filters select:focus{border-color:var(--ink)}
.count{font-size:12px;color:var(--ink-3);margin-bottom:10px}

/* ---------- 客戶卡 ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.c-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;cursor:pointer;transition:border-color .12s
}
.c-card:hover{border-color:var(--ink-3)}
.c-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c-name{font-weight:650;font-size:15px;letter-spacing:-.01em}
.c-phone{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.c-tags{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-new{background:var(--s-new-bg);color:var(--s-new)}
.t-track{background:var(--s-track-bg);color:var(--s-track)}
.t-visit{background:var(--s-visit-bg);color:var(--s-visit)}
.t-close{background:var(--s-close-bg);color:var(--s-close)}
.t-back{background:#E4EEF9;color:#1F4E79}
.t-deal{background:var(--s-visit-bg);color:var(--s-visit)}
.t-grade{background:var(--brass-soft);color:var(--brass)}
.t-warn{background:var(--danger-bg);color:var(--danger)}
.c-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--ink-3)}
.c-meta b{font-weight:600;color:var(--ink-2)}
.c-last{
  margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-2);
  font-size:12.5px;color:var(--ink-2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.c-last em{font-style:normal;color:var(--ink-3);margin-right:6px}
.c-due{color:var(--danger);font-weight:600}

/* ---------- 詳情 ---------- */
.back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);font-weight:600;padding:12px 0}
.d-head{margin-bottom:4px}
.d-name{font-size:24px;font-weight:650;letter-spacing:-.02em}
.d-phone{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts{display:flex;gap:8px;margin:16px 0}
.acts .btn{flex:1}
.sec{margin-top:20px}
.sec-h{
  display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:9px
}
.sec-h::after{content:'';flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cell{background:var(--card);padding:9px 12px}
.cell label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:1px}
.cell span{font-size:14px;font-weight:550}
/* 時間軸 */
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.ev{position:relative;padding:0 0 14px}
.ev::before{content:'';position:absolute;left:-18px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--ink-3)}
.ev.e-visit::before{border-color:var(--s-visit)}
.ev.e-call::before{border-color:var(--s-track)}
.ev-h{display:flex;align-items:baseline;gap:8px;cursor:pointer}
.ev-t{font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--line-2);color:var(--ink-2)}
.ev.e-visit .ev-t{background:var(--s-visit-bg);color:var(--s-visit)}
.ev.e-call .ev-t{background:var(--s-track-bg);color:var(--s-track)}
.ev-d{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev-w{font-size:12px;color:var(--ink-3)}
.ev-b{font-size:13.5px;color:var(--ink-2);line-height:1.62;margin-top:5px;white-space:pre-wrap}
.ev-b.fold{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-h{align-items:center}
.ev-t,.ev-d,.ev-w{cursor:pointer}
.ev-ed{font-size:11px;color:var(--brass);background:var(--brass-soft);padding:1px 7px;border-radius:20px;cursor:pointer;font-weight:650}
.ev-btn{margin-left:auto;font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:3px 10px;background:var(--card);white-space:nowrap}
.ev-btn:hover{border-color:var(--ink-3)}
.trail{background:var(--line-2);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;max-height:180px;overflow-y:auto}
.ev-note{margin-top:6px;padding:7px 10px;background:var(--brass-soft);border-radius:7px;font-size:12.5px;color:#6B5220}
.ev-note b{font-weight:700}
.hist{background:var(--line-2);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--ink-2);line-height:1.62;white-space:pre-wrap}

/* ---------- 彈窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,31,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;padding:20px 18px 26px}
@media(min-width:640px){.mask{align-items:center}.sheet{border-radius:14px;max-height:88vh}}
.sheet h2{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:3px}
.sheet .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
/* 對客資看板 */
.rev-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.rev-bar input[type=date]{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);outline:none}
.rev-bar label.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);font-weight:500;margin:0;cursor:pointer}
.rev-bar label.chk input{width:16px;height:16px;margin:0}
.rng{padding:8px 15px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;color:var(--ink-3)}
.rng.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rng-info{font-size:12px;color:var(--ink-3);margin-left:4px}
.wx{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px;outline:none}
.wx.hidden{display:none}
.rg{margin-bottom:22px}
.rg-h{display:flex;align-items:baseline;gap:10px;padding:10px 0 8px;border-bottom:2px solid var(--ink)}
.rg-n{font-size:17px;font-weight:650;letter-spacing:-.01em}
.rg-c{font-size:12px;color:var(--ink-3)}
.rg-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:12px 0 7px}
.rg-lbl-t{color:var(--s-visit)}
.rc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.rc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rc-n{font-weight:650;font-size:14.5px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
.rc-p{font-size:12px;color:var(--ink-3)}
.rc-r{font-size:11.5px;color:var(--s-track);background:var(--s-track-bg);padding:2px 8px;border-radius:20px}
.rc textarea,.rc input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;line-height:1.6;outline:none;background:var(--paper)}
.rc textarea:focus,.rc input:focus{border-color:var(--ink);background:var(--card)}
.rc input[type=text]{margin-top:6px;font-size:13px}
.rc-msg{font-size:11.5px;color:var(--ink-3);margin-top:4px;min-height:14px}
.rc-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:8px}
.fbar{display:flex;align-items:center;gap:10px;background:var(--brass-soft);color:#6B5220;padding:8px 12px;border-radius:var(--r);font-size:12.5px;margin-bottom:10px;font-weight:600}
.fclear{margin-left:auto;font-size:12px;color:#6B5220;border:1px solid rgba(156,122,60,.35);border-radius:6px;padding:3px 10px;background:transparent}
.filters select.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:650}
#revWho{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px;outline:none}
.rc-msg.ok{color:var(--s-visit)}
.rc-msg.err{color:var(--danger)}
.saved{display:inline-block;background:var(--s-visit-bg);color:var(--s-visit);padding:2px 10px;border-radius:20px;font-weight:700;font-size:11.5px}
.savefail{display:inline-block;background:var(--danger-bg);color:var(--danger);padding:2px 10px;border-radius:20px;font-weight:700;font-size:11.5px}
.rf{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;cursor:pointer;font-size:13.5px}
.rf:hover{border-color:var(--ink-3)}
.rf-n{font-weight:600}
.rf-m{font-size:12px;color:var(--ink-3)}
.rf-d{margin-left:auto;font-size:12px;color:var(--ink-3)}
.rf-d.od{color:var(--danger);font-weight:600}
.rg-sum{display:flex;align-items:center;gap:8px;background:var(--line-2);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--ink-2);margin-top:10px}
.rg-sum b{font-weight:700;color:var(--ink)}
.rg-go{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:4px 12px;background:var(--card)}
.void-bar{background:var(--danger-bg);color:var(--danger);border-radius:var(--r);padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
.d-head.voided .d-name{text-decoration:line-through;opacity:.6}
.ev-void{opacity:.5}
.ev-void .ev-b{text-decoration:line-through}
.btn-danger{color:var(--danger);border-color:var(--danger-bg)}
.e-visit{background:var(--s-visit-bg);color:var(--s-visit)}
.e-back{background:#E4EEF9;color:#1F4E79}
.e-call{background:var(--s-track-bg);color:var(--s-track)}
.e-track{background:var(--line-2);color:var(--ink-3)}
/* 報表 */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.stat-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:center}
.stat-l{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.stat-v{font-size:24px;font-weight:650;letter-spacing:-.02em}
.stat-s{font-size:11px;color:var(--ink-3);margin-top:2px}
.cp{margin-bottom:8px}
.cpx{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--card);letter-spacing:0;text-transform:none}
.rt{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rt th{background:var(--line-2);padding:8px 10px;text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.rt td{padding:8px 10px;border-top:1px solid var(--line-2);vertical-align:top}
.rt td.z{color:var(--line)}
.rt td.nt{font-size:12.5px;color:var(--ink-2);line-height:1.55;max-width:280px}
.rt th:not(:first-child),.rt td:not(:first-child):not(.nt){text-align:center;font-variant-numeric:tabular-nums}
.cbox-list{display:flex;flex-direction:column;gap:5px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:150px;overflow-y:auto}
.cbox-list label.cbl{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:400;color:var(--ink);margin:0;cursor:pointer;padding:4px 0}
.cbox-list label.cbl input{width:16px;height:16px;flex-shrink:0;margin:0}
.cbox-list label.cbl b{font-weight:650}
.cbl b{font-weight:650}
/* 匯入預覽與說明 */
.note-box{background:var(--brass-soft);border-radius:var(--r);padding:12px 14px;font-size:12.5px;color:#6B5220;line-height:1.7;margin-bottom:14px}
.warn-box{background:var(--danger-bg);border-left:3px solid var(--danger);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--danger);line-height:1.8;margin:14px 0}
.warn-box b{font-weight:700}
.mini-link{font-size:11.5px;color:var(--ink-3);text-decoration:underline;margin-left:8px;background:none;border:none;padding:0;font-weight:500}
.mini-link:hover{color:var(--ink)}
.note-box .btn{margin-top:8px}
.prev{border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.prev-row{padding:8px 12px;border-bottom:1px solid var(--line-2);font-size:13px;background:var(--card)}
.prev-row:last-child{border-bottom:none}
.prev-row span{color:var(--ink-3);font-size:12px;margin-left:6px}
.cbox-list input.ucase,.cbox-list input.pcase{width:16px;height:16px;flex-shrink:0;margin:0}
/* 設定分頁 */
.dlist,.ulist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.drow{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;background:var(--card)}
.drow:last-child{border-bottom:none}
.drow:hover{background:var(--line-2)}
.dname{font-weight:600;font-size:14px}
.dcount{margin-left:auto;font-size:12px;color:var(--ink-3)}
.dgo{color:var(--ink-3);font-size:16px}
.dtag{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:20px;background:var(--line-2);color:var(--ink-3)}
.dtag-fix{background:var(--brass-soft);color:var(--brass)}
.dtag-on{background:var(--s-track-bg);color:var(--s-track)}
.dtag-off{background:var(--danger-bg);color:var(--danger)}
.ditem{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ditem input{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;background:var(--card);min-width:0}
.dord{font-size:11px;color:var(--ink-3);width:20px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.dmv{width:28px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink-2);font-size:11px;flex-shrink:0;line-height:1}
.dmv:hover:not(:disabled){border-color:var(--ink);background:var(--line-2)}
.dmv:disabled{opacity:.25;cursor:default}
.ditem input:focus{border-color:var(--ink)}
.ditem.off input{opacity:.5;text-decoration:line-through}
.copy-x{font-size:12px;color:var(--ink-3);padding:6px 10px;border:1px solid var(--line);border-radius:7px;white-space:nowrap;background:var(--card)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;outline:none;background:var(--card)}
.urow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);background:var(--card)}
.urow:last-child{border-bottom:none}
.urow.off{opacity:.55}
.uinfo{font-size:14px}
.uinfo .dtag{margin-left:5px}
.uc{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.uops{margin-left:auto;display:flex;gap:6px;align-items:center}
.uself{font-size:11.5px;color:var(--ink-3);padding:0 4px}
.chks{display:flex;gap:20px;font-size:13.5px;padding-top:4px;flex-wrap:wrap}
.field label.chkl{display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;color:var(--ink);margin:0;white-space:nowrap;cursor:pointer}
.field label.chkl input{width:16px;height:16px;flex-shrink:0;margin:0}
.field.wide{grid-column:1/-1}
#cfgView textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);outline:none;font-family:ui-monospace,monospace;font-size:13px;line-height:1.6;background:var(--card)}
#cfgView textarea:focus{border-color:var(--ink)}
.sheet-acts{display:flex;gap:8px;margin-top:18px}
.sheet-acts .btn{flex:1}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3);font-size:14px}
.load{text-align:center;padding:40px;color:var(--ink-3);font-size:13px}
/* 案場選擇 */
.case-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.case-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .12s
}
.case-item:hover{border-color:var(--ink)}
.case-item .n{font-weight:650;font-size:16px}
.case-item .s{font-size:12px;color:var(--ink-3)}
.case-item .go{margin-left:auto;color:var(--ink-3)}
/* 建檔情境切換 */
.segs{display:flex;gap:8px}
.seg{flex:1;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:14px;font-weight:600;color:var(--ink-3)}
.seg.on{border-color:var(--ink);background:var(--ink);color:#fff}
/* 相關聯絡人 */
.ct-row{display:grid;grid-template-columns:1fr 80px 1.2fr 32px;gap:6px;margin-bottom:6px}
.ct-row input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;min-width:0}
.ct-row input:focus{border-color:var(--ink)}
.ct-x{color:var(--ink-3);font-size:13px}
.hint{font-size:12px;color:var(--ink-3);padding:6px 0}
.d-contacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.d-contacts span{font-size:12px;color:var(--ink-3);background:var(--line-2);border-radius:6px;padding:3px 9px}
/* 介紹戶別 */
.units{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:190px;overflow-y:auto}
.unit{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px;color:var(--ink-2)}
.unit.on{border-color:var(--brass);background:var(--brass-soft);color:var(--brass);font-weight:650}
.req{color:var(--danger)}
.dup{padding:9px 12px;border-radius:8px;font-size:13px;margin:-4px 0 12px;line-height:1.6}
.dup b{display:block;font-weight:700;margin-bottom:2px}
.dup .btn{margin-left:8px}
.dup-block{background:var(--danger-bg);color:var(--danger)}
.dup-warn{background:var(--s-new-bg);color:var(--s-new)}
.dup-ok{background:var(--s-visit-bg);color:var(--s-visit)}
.dup-chk{background:var(--line-2);color:var(--ink-3)}
.bulk{position:sticky;top:52px;z-index:10;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:9px 12px;border-radius:var(--r);margin-bottom:10px;font-size:13px;font-weight:600}
.bulk select{padding:7px 12px;border-radius:7px;border:none;font-size:13px;margin-left:auto;background:var(--card);color:var(--ink);min-width:150px;font-weight:600}
.bulk .btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.c-card.has-sel{padding-left:40px;position:relative}
.cbox{position:absolute;left:14px;top:15px;width:17px;height:17px;border:1.5px solid var(--line);border-radius:5px;background:var(--card)}
.cbox.on{background:var(--ink);border-color:var(--ink)}
.cbox.on::after{content:'✓';color:#fff;font-size:11px;position:absolute;left:3px;top:-1px}
#impView textarea{font-family:ui-monospace,monospace;font-size:13px;line-height:1.6}
</style>
</head>
<body>

<!-- ===== 登入 ===== -->
<div id="login">
  <div class="login-card">
    <div class="mark"><span>禹盛</span></div>
    <h1>案場客戶管理</h1>
    <div class="sub">禹盛開發股份有限公司</div>
    <div class="field">
      <label>帳號</label>
      <input type="text" id="acc" autocomplete="username" autocapitalize="off">
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="pwd" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-full" id="loginBtn" onclick="doLogin()">登入</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ===== 選案場 ===== -->
<div id="picker" class="hidden">
  <div class="top"><div class="top-in">
    <div class="top-case">選擇案場<small id="pickWho"></small></div>
    <div class="top-sp"></div>
    <button class="btn btn-ghost btn-sm" onclick="logout()">登出</button>
  </div></div>
  <div class="wrap" style="padding-top:20px">
    <div class="eyebrow">你可以進入的案場</div>
    <div class="case-list" id="caseList"></div>
  </div>
</div>

<!-- ===== 主畫面 ===== -->
<div id="main" class="hidden">
  <div class="top"><div class="top-in">
    <div class="top-case"><span id="caseName"></span><small id="whoLine"></small></div>
    <div class="top-sp"></div>
    <button class="icon-btn" onclick="reload()" title="重新整理">↻</button>
    <button class="btn btn-ghost btn-sm hidden" id="switchCase" onclick="backToPicker()">換案場</button>
    <button class="btn btn-ghost btn-sm" onclick="logout()">登出</button>
  </div></div>

  <div class="wrap">
    <!-- 列表 -->
    <div id="listView">
      <div class="tabs">
        <div class="tab on" data-tab="all" onclick="setTab('all')">全部客戶</div>
        <div class="tab" data-tab="due" onclick="setTab('due')">今日該追</div>
        <div class="tab p-dis hidden" data-tab="pend" onclick="setTab('pend')">待派工<span id="pendN"></span></div>
        <div class="tab p-all hidden" data-tab="imp" onclick="setTab('imp')">廠商名單</div>
        <div class="tab p-all hidden" data-tab="rev" onclick="setTab('rev')">對客資</div>
        <div class="tab" data-tab="rpt" onclick="setTab('rpt')">報表</div>
        <div class="tab p-mgr hidden" data-tab="cfg" onclick="setTab('cfg')">設定</div>
      </div>
      <div class="search-row">
        <input type="text" id="kw" placeholder="搜尋姓名、電話、紀錄內容…" oninput="render()">
        <button class="btn btn-ghost p-dis hidden" id="selBtn" onclick="toggleSelMode()">批次改派</button>
        <button class="btn" onclick="openNew()" title="客人打電話進來或直接走進來時用">＋ 建客戶</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="fbar hidden" id="fbar"><span id="fbarTxt"></span><button class="fclear" onclick="clearFilters()">清除篩選</button></div>
      <div id="listBody">
        <div class="bulk hidden" id="bulkBar">
          <span id="bulkN">已選 0 筆</span>
          <select id="bulkWho"></select>
          <button class="btn btn-sm" onclick="doBulk()">分派</button>
          <button class="btn btn-sm btn-ghost" onclick="clearSel()">取消</button>
        </div>
        <div class="count" id="count"></div>
        <div class="list" id="list"><div class="load">載入中…</div></div>
      </div>
      <div id="impView" class="hidden">
        <div class="segs" style="margin:14px 0">
          <button class="seg on" data-imp="quick" onclick="pickImp(this)">廠商給的網路名單</button>
          <button class="seg p-dis hidden" data-imp="bulk" onclick="pickImp(this)">舊名單（批次匯入）</button>
        </div>

        <div id="impQuick">
          <div class="warn-box">⚠　這裡只放<b>廠商交來的名單</b>（客人還沒接觸過，會進待派工）。<br>
            客人自己<b>打電話進來</b>、或<b>直接走進來</b> → 請回「全部客戶」用右上角<b>「＋ 建客戶」</b>。</div>
          <div class="sec-h">建立廠商名單</div>
          <div class="two">
            <div class="field"><label>姓名 <span class="req">*</span></label><input type="text" id="qName"></div>
            <div class="field"><label>電話 <span class="req">*</span></label><input type="tel" id="qPhone" oninput="qDup()"></div>
          </div>
          <div id="qDupBox"></div>
          <div class="two">
            <div class="field"><label>來源（媒體）<span class="req">*</span></label><select id="qMedia"></select></div>
            <div class="field"><label>居住區域</label><select id="qArea"></select></div>
            <div class="field"><label>購屋用途</label><select id="qMotive"></select></div>
            <div class="field p-dis hidden"><label>指派給</label><select id="qOwner"></select></div>
          </div>
          <div class="field"><label>備註</label>
            <input type="text" id="qNote" placeholder="方便聯絡時間、客戶說的話…（會寫進歷史背景）">
          </div>
          <button class="btn" onclick="qSave()">建立並繼續下一筆</button>
          <div id="qMsg"></div>
          <div class="hint" id="qCount"></div>
        </div>

        <div id="impBulk" class="hidden">
          <div class="sec-h">舊名單批次匯入</div>
          <div class="note-box">
            只有「客戶姓名」「主要電話」是必要欄位，其餘有就填、沒有就空。<br>
            欄位順序不拘，系統照標題名稱對應。<b>沒認得的欄位會自動併入歷史背景，不會遺失。</b>
            <button class="btn btn-sm btn-ghost" onclick="dlTpl()">↓ 下載範本</button>
          </div>
          <div class="field"><label>選擇 CSV 檔</label><input type="file" id="bulkFile" accept=".csv,.txt" onchange="readCsv(this)"></div>
          <div class="field"><label>或直接貼上（含標題列）</label>
            <textarea id="bulkText" rows="8" placeholder="客戶姓名,主要電話,居住區域,媒體來源,購屋用途&#10;王先生,0912345678,南屯區,POP,自住"></textarea>
          </div>
          <button class="btn btn-ghost" onclick="previewBulk()">預覽</button>
          <div id="bulkPrev"></div>
        </div>
      </div>

      <div id="cfgView" class="hidden">
        <div class="segs" style="margin:14px 0">
          <button class="seg on" data-cfg="dict" onclick="pickCfg(this)">選項字典</button>
          <button class="seg" data-cfg="case" onclick="pickCfg(this)">案場設定</button>
          <button class="seg" data-cfg="user" onclick="pickCfg(this)">帳號管理</button>
          <button class="seg" data-cfg="mgr" onclick="pickCfg(this)">案場管理</button>
          <button class="seg" data-cfg="exp" onclick="pickCfg(this)">客資整合下載</button>
        </div>
        <div id="cfgDict"><div class="load">載入中…</div></div>
        <div id="cfgCase" class="hidden"></div>
        <div id="cfgUser" class="hidden"></div>
        <div id="cfgMgr" class="hidden"></div>
        <div id="cfgExp" class="hidden"></div>
      </div>

      <div id="revView" class="hidden">
        <div class="rev-bar">
          <input type="date" id="revDate" onchange="loadReview()">
          <select id="revWho" onchange="drawReview()"><option value="">全部業務</option></select>

          <button class="btn btn-sm btn-ghost" onclick="loadReview()">重新整理</button>
        </div>
        <div id="revBody"><div class="load">載入中…</div></div>
      </div>

      <div id="rptView" class="hidden">
        <div class="rev-bar">
          <button class="rng on" data-r="today" onclick="pickRng(this)">本日</button>
          <button class="rng" data-r="week" onclick="pickRng(this)">本週</button>
          <button class="rng" data-r="month" onclick="pickRng(this)">本月</button>
          <button class="rng" data-r="all" onclick="pickRng(this)">全案</button>
          <select id="rptWx" class="wx"><option value="">天氣</option><option>晴</option><option>陰</option><option>雨</option><option>陰雨</option><option>陰時多雲</option></select>
          <span class="rng-info" id="rngInfo"></span>
        </div>
        <div id="rptBody"><div class="load">載入中…</div></div>
      </div>
    </div>

    <!-- 詳情 -->
    <div id="detailView" class="hidden">
      <div class="back" onclick="closeDetail()">← 返回列表</div>
      <div id="detail"></div>
    </div>
  </div>
</div>

<div id="busyBar" class="hidden">處理中…</div>
<div id="modal"></div>

<script>
// ===================== 案場管理 =====================
function caseChecks(){
  var list=S.allCases&&S.allCases.length?S.allCases:S.cases;
  return '<label class="cbl"><input type="checkbox" id="uAll" onchange="toggleAllCase(this)"> <b>全部案場</b>（含未來新增）</label>'+
    list.map(function(c){
      return '<label class="cbl"><input type="checkbox" class="ucase" value="'+esc(c.code)+'"> '+esc(c.name)+'</label>';
    }).join('');
}
function toggleAllCase(el){
  document.querySelectorAll('.ucase').forEach(function(e){ e.disabled=el.checked; if(el.checked) e.checked=false; });
}
function collectCases(){
  if($('uAll') && $('uAll').checked) return '全部';
  var a=[];
  document.querySelectorAll('.ucase:checked').forEach(function(e){ a.push(e.value); });
  return a.join(',');
}
function loadCases(){
  $('cfgMgr').innerHTML='<div class="load">載入中…</div>';
  api({action:'caseList'}).then(function(r){
    if(!r.ok){ $('cfgMgr').innerHTML='<div class="empty">'+esc(r.error||'')+'</div>'; return; }
    S.allCases=r.cases;
    $('cfgMgr').innerHTML=
      '<div class="ulist">'+r.cases.map(function(c){
        return '<div class="urow"><div class="uinfo"><b>'+esc(c.name)+'</b>'+
          '<span class="dtag">'+esc(c.code)+'</span>'+
          '<span class="dtag'+(c.status==='銷售中'?' dtag-on':'')+'">'+esc(c.status||'')+'</span>'+
          '<div class="uc">'+c.clients+' 位客戶</div></div>'+
          '<div class="uops"><a class="copy-x" href="https://docs.google.com/spreadsheets/d/'+c.id+'/edit" target="_blank">開試算表</a></div>'+
        '</div>';
      }).join('')+'</div>'+
      '<div class="sec-h">新增案場</div>'+
      '<div class="note-box">建立後系統會自動產生一份新試算表，並複製你選的案場字典設定（區域、媒體、職業等 130 個選項），不用重打。建立完到「案場設定」改案名、戶別清單、追蹤天數就能用。</div>'+
      '<div class="two">'+
        '<div class="field"><label>案名 <span class="req">*</span></label><input type="text" id="ncName" placeholder="例：禹盛大境"></div>'+
        '<div class="field"><label>案場代碼 <span class="req">*</span></label><input type="text" id="ncCode" placeholder="2-10 碼英數，例：YSDJ"></div>'+
        '<div class="field"><label>案件類型</label><select id="ncType">'+opts('案件類型','','')+'</select></div>'+
        '<div class="field"><label>字典複製自</label><select id="ncFrom">'+
          r.cases.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('')+
        '</select></div>'+
      '</div>'+
      '<button class="btn" onclick="caseAdd()">建立案場</button><div id="ncMsg"></div>';
  });
}
function caseAdd(){
  var name=$('ncName').value.trim(), code=$('ncCode').value.trim().toUpperCase();
  if(!name||!code){ alert('請填寫案名與案場代碼'); return; }
  if(!confirm('要建立案場「'+name+'」（代碼 '+code+'）？\n\n系統會產生新的試算表並複製字典設定。')) return;
  $('ncMsg').innerHTML='<div class="msg">建立中…請稍候</div>';
  api({action:'caseAdd',name:name,code:code,type:$('ncType').value,copyFrom:$('ncFrom').value}).then(function(r){
    if(!r.ok){ $('ncMsg').innerHTML='<div class="msg msg-err">'+esc(r.error||'')+'</div>'; return; }
    $('ncMsg').innerHTML='<div class="msg msg-ok">已建立「'+esc(r.name)+'」。重新登入後就能在案場清單看到。</div>';
    $('ncName').value=''; $('ncCode').value='';
    loadCases();
  });
}

// ===================== 客資整合下載 =====================
function drawExport(){
  $('cfgExp').innerHTML=
    '<div class="note-box">下載本案完整客戶資料，每位客戶一列，最後一欄是他所有互動紀錄串起來的<b>完整歷程</b>。<br>'+
    '用 Excel 打開就是完整的一份，可以交案、備份、或給建商。</div>'+
    '<div class="two">'+
      '<div class="field"><label>業務（不選＝全部）</label><select id="exOwner"><option value="">全部業務</option>'+
        staffList().map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>階段（不選＝全部）</label><select id="exStage">'+opts('客戶階段','','全部階段')+'</select></div>'+
    '</div>'+
    '<div class="field"><label>格式</label><div class="segs">'+
      '<button class="seg on" data-ex="csv" onclick="pickEx(this)">CSV（Excel 可開）</button>'+
      '<button class="seg" data-ex="txt" onclick="pickEx(this)">純文字（好閱讀）</button>'+
    '</div></div>'+
    '<button class="btn" onclick="doExport()">產生並下載</button>'+
    '<div id="exMsg"></div>';
  S.exFmt='csv';
}
function pickEx(el){
  document.querySelectorAll('#cfgExp .seg').forEach(function(e){ e.classList.toggle('on', e===el); });
  S.exFmt=el.dataset.ex;
}
function csvCell(v){
  var s=String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function doExport(){
  $('exMsg').innerHTML='<div class="msg">產生中…資料多的話要等幾秒</div>';
  api({action:'exportAll',owner:$('exOwner').value,stage:$('exStage').value}).then(function(r){
    if(!r.ok){ $('exMsg').innerHTML='<div class="msg msg-err">'+esc(r.error||'產生失敗')+'</div>'; return; }
    var 檔名=(r.案名||'客戶資料')+'_'+r.產生時間.replace(/[-: ]/g,'').slice(0,12);
    var blob, ext;
    if(S.exFmt==='csv'){
      var lines=[r.headers.map(csvCell).join(',')];
      r.rows.forEach(function(o){ lines.push(r.headers.map(function(k){return csvCell(o[k]);}).join(',')); });
      blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
      ext='.csv';
    } else {
      var t=['【'+(r.案名||'')+'】客戶資料　產生於 '+r.產生時間,'共 '+r.rows.length+' 位客戶','',''].join('\n');
      r.rows.forEach(function(o,i){
        t+='━━━ '+(i+1)+'. '+(o['客戶姓名']||'未填姓名')+'　'+(o['主要電話']||'')+' ━━━\n';
        r.headers.forEach(function(k){
          if(k==='完整歷程'||k==='客戶姓名'||k==='主要電話') return;
          if(o[k]==null||String(o[k]).trim()==='') return;
          t+='  '+k+'：'+o[k]+'\n';
        });
        if(o['完整歷程']) t+='\n  【互動歷程】\n'+String(o['完整歷程']).split('\n').map(function(x){return '  '+x;}).join('\n')+'\n';
        t+='\n';
      });
      blob=new Blob([t],{type:'text/plain;charset=utf-8'});
      ext='.txt';
    }
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=檔名+ext;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
    $('exMsg').innerHTML='<div class="msg msg-ok">已下載 '+r.rows.length+' 位客戶（'+r.headers.length+' 欄）</div>';
  });
}

// ===================== 對客資看板 =====================
function loadReview(){
  var d=$('revDate');
  if(!d.value) d.value=today();
  $('revBody').innerHTML='<div class="load">載入中…</div>';
  api({action:'review',date:d.value}).then(function(r){
    if(!r.ok){ $('revBody').innerHTML='<div class="empty">'+esc(r.error||'載入失敗')+'</div>'; return; }
    S.rev=r;
    drawReview();
  });
}
function drawReview(){
  var r=S.rev;
  if(!r.groups.length){ $('revBody').innerHTML='<div class="empty">這天沒有需要討論的資料</div>'; return; }
  // 業務下拉（只建一次）
  var sw=$('revWho');
  if(sw && sw.options.length<=1){
    sw.innerHTML='<option value="">全部業務</option>'+
      r.groups.map(function(g){return '<option>'+esc(g.name)+'</option>';}).join('');
  }
  var only=sw?sw.value:'';
  var gs=only? r.groups.filter(function(g){return g.name===only;}) : r.groups;
  if(!gs.length){ $('revBody').innerHTML='<div class="empty">這位業務今天沒有資料</div>'; return; }
  $('revBody').innerHTML=gs.map(function(g,gi){
    return '<div class="rg">'+
      '<div class="rg-h"><span class="rg-n">'+esc(g.name)+'</span>'+
        '<span class="rg-c">今日 '+g.today.length+' 組・追蹤中 '+g.followTotal+' 組</span></div>'+
      (g.today.length?
        '<div class="rg-lbl rg-lbl-t">今日到場與聯繫</div>'+
        g.today.map(function(x,i){ return todayCard(gi,i,x); }).join('') : '')+
      (g.followTotal?
        '<div class="rg-sum">追蹤狀況　該追 <b>'+g.followTotal+'</b> 組'+
        (g.oldest?'・最久 <b>'+g.oldest+'</b> 天沒動':'')+
        '<button class="rg-go" onclick="goDue(\''+esc(g.name)+'\')">看清單</button></div>' : '')+
    '</div>';
  }).join('');
}

function typeCls(t){
  if(t==='來人') return 'e-visit';
  if(t==='回訪') return 'e-back';
  if(t==='來電') return 'e-call';
  return 'e-track';
}
function todayCard(gi,i,x){
  var id='rv_'+gi+'_'+i;
  return '<div class="rc">'+
    '<div class="rc-h">'+
      '<span class="tag '+typeCls(x.type)+'">'+esc(x.type)+'</span>'+
      '<span class="rc-n" onclick="openDetail(\'' + x.cid + '\')">'+esc(x.name||'未填姓名')+'</span>'+
      '<span class="rc-p">'+esc(x.phone)+'</span>'+
      (x.result?'<span class="rc-r">'+esc(x.result)+'</span>':'')+
      (x.grade?'<span class="tag t-grade">'+esc(x.grade)+'</span>':'')+
      (x.back>0?'<span class="tag t-back">回訪'+x.back+'次</span>':'')+
      (x.deal&&x.deal!=='未成交'?'<span class="tag t-deal">'+esc(x.deal)+'</span>':'')+
    '</div>'+
    '<div class="rc-meta">'+
      [x.area&&('區域 '+x.area), x.media&&('媒體 '+x.media), x.motive&&('用途 '+x.motive),
       x.budget&&('預算 '+x.budget), x.unit&&('戶別 '+x.unit)]

    '<span class="rf-n">'+esc(x.name||'未填姓名')+'</span>'+

function saveEv(eid,id){
  var note=$(id+'_n').value, boss=$(id+'_b').value;
  var msg=$(id+'_m');
  msg.textContent='儲存中…'; msg.className='rc-msg';
  api({action:'updEvent',eid:eid,note:note,boss:boss}).then(function(r){
    if(r.ok){
      msg.innerHTML='<span class="saved">✓ 已儲存</span>';
      msg.className='rc-msg ok';
      setTimeout(function(){ msg.innerHTML=''; msg.className='rc-msg'; },3500);
    } else {
      msg.innerHTML='<span class="savefail">✕ 儲存失敗：'+esc(r.error||'')+'　請重試</span>';
      msg.className='rc-msg err';
    }
  });
}

function initRpt(){ if(!S.rptRange){ S.rptRange='today'; } loadRpt(); }
function pickRng(el){
  document.querySelectorAll('.rng').forEach(function(e){ e.classList.toggle('on', e===el); });
  S.rptRange=el.dataset.r;
  loadRpt();
}
function rngDates(){
  var d=new Date(), y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  function f(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
  var to=f(d), from='';
  if(S.rptRange==='today') from=to;
  else if(S.rptRange==='week'){ var dow=d.getDay()||7; var mon=new Date(y,m,day-dow+1); from=f(mon); }
  else if(S.rptRange==='month'){ from=f(new Date(y,m,1)); }
  else from='';
  return {from:from,to:to};
}
function loadRpt(){
  var r=rngDates();
  var 始=String((S.config||{})['統計起始日']||'').replace(/\//g,'-');
  $('rngInfo').textContent = r.from ? (r.from+' ~ '+r.to) : (始? ('全案累計 '+始+' ~ '+r.to) : ('全案累計至 '+r.to));
  $('rptWx').classList.toggle('hidden', S.rptRange!=='today');
  $('rptBody').innerHTML='<div class="load">計算中…</div>';
  api({action:'report',from:r.from,to:r.to}).then(function(res){
    if(!res.ok){ $('rptBody').innerHTML='<div class="empty">'+esc(res.error||'')+'</div>'; return; }
    S.rpt=res; drawRpt();
    if(res.from && S.rptRange==='all') $('rngInfo').textContent='全案累計 '+res.from+' ~ '+res.to;
  });
}
function drawRpt(){
  var r=S.rpt;
  var 類 = r.個人版 ? ['來電','來人','回訪'] : ['名單進件','來電','來人','回訪'];
  var 別名={'名單進件':'網路預約','來電':'來電','來人':'來人','回訪':'回訪'};
  var h='';
  h+='<div class="stat">'+類.map(function(t){
    return '<div class="stat-c"><div class="stat-l">'+別名[t]+'</div><div class="stat-v">'+(r.組數[t]||0)+'</div>'+
      '<div class="stat-s">累計 '+(r.累計[t]||0)+'</div></div>';
  }).join('')+'</div>';
  if(r.個人版){
    h='<div class="note-box">以下只計算<b>你自己的客戶</b>（'+esc(r.本人||'')+'）</div>'+h;
  } else {
    var lbl={today:'複製本日日報',week:'複製本週統計',month:'複製本月統計',all:'複製全案累計'}[S.rptRange]||'複製統計文字';
    h+='<button class="btn btn-sm btn-ghost cp" onclick="copyDaily()">'+lbl+'</button>';
  }

  ['居住區域','媒體來源','客戶職業','年齡層','購屋用途'].forEach(function(label){
    var x=r.交叉[label]||{};
    var keys={};
    類.forEach(function(t){ Object.keys(x[t]||{}).forEach(function(k){ keys[k]=1; }); });
    var ks=Object.keys(keys);
    if(!ks.length) return;
    ks.sort(function(a,b){
      var sa=類.reduce(function(s,t){ return s+((x[t]||{})[a]||0); },0);
      var sb=類.reduce(function(s,t){ return s+((x[t]||{})[b]||0); },0);
      return sb-sa;
    });
    h+='<div class="sec-h">'+label+'分析'+
       (r.個人版?'':'<button class="cpx" onclick="copySec(\'' + label + '\')">複製</button>')+'</div>'+
      '<table class="rt"><thead><tr><th>'+label+'</th>'+類.map(function(t){return '<th>'+別名[t]+'</th>';}).join('')+'</tr></thead><tbody>'+
      ks.map(function(k){
        return '<tr><td>'+esc(k)+'</td>'+類.map(function(t){
          var n=(x[t]||{})[k]||0;
          return '<td'+(n?'':' class="z"')+'>'+(n||'—')+'</td>';
        }).join('')+'</tr>';
      }).join('')+'</tbody></table>';
  });

  h+='<div class="sec-h">成交狀態（目前狀態，不隨區間變動）</div><div class="stat">'+
    ['未成交','已小訂','已補足','已簽約','已退戶'].map(function(k){
      return '<div class="stat-c"><div class="stat-l">'+k+'</div><div class="stat-v">'+(r.成交[k]||0)+'</div></div>';
    }).join('')+'</div>';

  h+='<div class="sec-h">有望客戶（A級，目前狀態）'+r.有望.length+' 組'+(r.個人版?'':'<button class="cpx" onclick="copyHope()">複製</button>')+'</div>'+
    (r.有望.length?'<table class="rt"><thead><tr><th>客戶</th><th>介紹戶別</th><th>階段</th><th>業務</th><th>最後互動</th></tr></thead><tbody>'+
      r.有望.map(function(x){
        return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.unit||'—')+'</td><td>'+esc(x.stage)+'</td><td>'+esc(x.owner||'—')+'</td><td>'+esc(x.last||'—')+'</td></tr>';
      }).join('')+'</tbody></table>':'<div class="hint">這個區間沒有 A 級客戶</div>');

  h+='<div class="sec-h">回訪客戶 '+r.回訪清單.length+' 組'+(r.個人版?'':'<button class="cpx" onclick="copyBack()">複製</button>')+'</div>'+
    (r.回訪清單.length?'<table class="rt"><thead><tr><th>日期</th><th>客戶</th><th>戶別</th><th>業務</th><th>紀錄</th></tr></thead><tbody>'+
      r.回訪清單.map(function(x){
        return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.unit||'—')+'</td><td>'+esc(x.owner||'—')+'</td><td class="nt">'+esc(x.note)+'</td></tr>';
      }).join('')+'</tbody></table>':'<div class="hint">這個區間沒有回訪</div>');

  $('rptBody').innerHTML=h;
}
function cp(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ alert('已複製'); });
  else { var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); alert('已複製'); }
}
function roc(d){
  var p=String(d).split('-');
  if(p.length<3) return String(d);
  return (Number(p[0])-1911)+'/'+p[1]+'/'+p[2];
}
function copyDaily(){
  if(!S.rpt||!S.rpt.日報){ alert('請先載入報表'); return; }
  var r=S.rpt, dr=rngDates(), rg=S.rptRange;
  var n = (rg==='today') ? r.日報.本日
        : (rg==='all')   ? r.日報.全案
        : r.組數;
  var 本日 = (rg==='today');
  var 標題, 段名;
  if(rg==='today'){
    var wx=$('rptWx').value;
    標題='【'+(r.案名||'')+'】'+roc(r.日報.今日)+'(週'+r.日報.星期+')'+wx;
    段名='本日統計';
  } else if(rg==='all'){
    var st=String((S.config||{})['統計起始日']||'').replace(/\//g,'-');
    標題='【'+(r.案名||'')+'】'+(st? roc(st)+' ~ '+roc(dr.to) : '全案累計 至 '+roc(dr.to));
    段名='全案累計';
  } else {
    標題='【'+(r.案名||'')+'】'+roc(dr.from)+' ~ '+roc(dr.to);
    段名=(rg==='week'?'本週累計':'本月累計');
  }
  var pre = 本日 ? '' : '累';
  var t = 標題+'\n'+段名+'：\n'+
    '網路預約'+(n['名單進件']||0)+'組\n'+
    '來人'+(n['來人']||0)+'組，來電'+(n['來電']||0)+'通，回籠'+(n['回訪']||0)+'組\n'+
    pre+'訂0戶0萬\n'+pre+'足0戶0萬\n'+pre+'簽0戶0萬\n買進0戶0萬';
  cp(t);
}
function copySec(label){
  if(!S.rpt||!S.rpt.交叉){ alert('請先載入報表'); return; }
  var r=S.rpt, x=r.交叉[label]||{};
  var 類=['名單進件','來電','來人','回訪'], 別名={'名單進件':'網路預約','來電':'來電','來人':'來人','回訪':'回訪'};
  var keys={}; 類.forEach(function(t){ Object.keys(x[t]||{}).forEach(function(k){ keys[k]=1; }); });
  var t2=label+'分析\n'+Object.keys(keys).map(function(k){
    return k+'：'+類.map(function(c){ return 別名[c]+' '+((x[c]||{})[k]||0); }).join('、');
  }).join('\n');
  cp(t2);
}
function copyHope(){
  if(!S.rpt||!S.rpt.有望){ alert('請先載入報表'); return; }
  var t=S.rpt.有望.map(function(x,i){
    return (i+1)+'. '+x.name+'　'+(x.unit||'')+'　'+x.stage+'　'+(x.owner||'');
  }).join('\n');
  cp('有望客戶\n'+t);
}
function copyBack(){
  if(!S.rpt||!S.rpt.回訪清單){ alert('請先載入報表'); return; }
  var t=S.rpt.回訪清單.map(function(x,i){
    return (i+1)+'. '+x.date+'　'+x.name+'　'+(x.unit||'')+'　'+(x.owner||'')+'\n　　'+x.note;
  }).join('\n');
  cp('回訪客戶\n'+t);
}

var API = 'https://script.google.com/macros/s/AKfycbwjACXIfVv_NZzRKdwemAZsk4LZnA6b8-xGzfVR9a7zAvRMums3LLQLEiOwWaoB3AM/exec';

var S = {};

// ===================== 工具 =====================
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function 送出_(payload, 重試){
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var to=setTimeout(function(){ if(ctl) ctl.abort(); }, 45000);
  function 再試(){
    return new Promise(function(res){ setTimeout(res,1200); }).then(function(){ return 送出_(payload, 重試-1); });
  }
  return fetch(API,{method:'POST',body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
    .then(function(r){
      clearTimeout(to);
      return r.text().then(function(t){
        if(t.indexOf('DOCTYPE')>=0 || t.indexOf('<html')>=0){
          if(重試>0) return 再試();
          throw new Error('伺服器暫時無法回應');
        }
        try{ return JSON.parse(t); }
        catch(e){ if(重試>0) return 再試(); throw new Error('回應格式錯誤'); }
      });
    })
    .catch(function(e){
      clearTimeout(to);
      if(重試>0 && e.name!=='AbortError') return 再試();
      throw e;
    });
}
function 顯示忙碌_(on,txt){
  var el=$('busyBar'); if(!el) return;
  if(on && txt) el.textContent=txt;
  el.classList.toggle('hidden', !on);
}
function api(body){
  var 首次=!S.warm;
  var 慢=setTimeout(function(){
    顯示忙碌_(true, 首次?'首次連線需要一點時間，請稍候…':'處理中…');
  }, 2000);
  return 送出_(Object.assign({token:S.token,case:S.caseCode},body), 2)
    .then(function(j){
      clearTimeout(慢); 顯示忙碌_(false);
      S.warm=true; S.lastCall=Date.now();
      if(j && !j.ok && /未授權|逾時/.test(j.error||'')){ alert('登入逾時，請重新登入'); logout(); throw new Error('auth'); }
      return j;
    })
    .catch(function(e){
      clearTimeout(慢); 顯示忙碌_(false);
      throw e;
    });
}
function 保溫_(){
  if(!S.token) return;
  if(Date.now()-(S.lastCall||0) > 210000){
    送出_({action:'ping'},0).then(function(){ S.lastCall=Date.now(); }).catch(function(){});
  }
}
function 預熱_(){
  送出_({action:'ping'},1).then(function(){ S.warm=true; S.lastCall=Date.now(); }).catch(function(){});
}
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function opts(name, cur, blank){
  var a = S.dict[name]||[];
  return (blank?'<option value="">'+blank+'</option>':'') +
    a.map(function(o){ return '<option'+(o.name===cur?' selected':'')+'>'+esc(o.name)+'</option>'; }).join('');
}
function stageCls(s){
  if(s==='已回訪') return 't-back';
  if(s==='已首參'||s==='已到場') return 't-visit';
  if(s==='已聯繫') return 't-track';
  if(s==='結案') return 't-close';
  return 't-new';
}

function doLogin(){
  var a=$('acc').value.trim(), p=$('pwd').value;
  if(!a||!p){ $('loginMsg').innerHTML='<div class="msg msg-err">請輸入帳號與密碼</div>'; return; }
  $('loginBtn').disabled=true; $('loginBtn').textContent='登入中…';
  $('loginMsg').innerHTML='<div class="msg">'+(S.warm?'登入中…':'首次連線需要一點時間，請稍候…')+'</div>';
  送出_({action:'login',account:a,password:p}, 2)
    .then(function(res){
      $('loginBtn').disabled=false; $('loginBtn').textContent='登入';
      S.warm=true; S.lastCall=Date.now();
      if(!res.ok){ $('loginMsg').innerHTML='<div class="msg msg-err">'+esc(res.error)+'</div>'; return; }
      S.token=res.token; S.user=res.user; S.user.account=a; S.cases=res.cases||[];
      $('loginMsg').innerHTML='';
      if(S.cases.length===1){ enterCase(S.cases[0]); }
      else { showPicker(); }
    })
    .catch(function(e){
      $('loginBtn').disabled=false; $('loginBtn').textContent='登入';
      $('loginMsg').innerHTML='<div class="msg msg-err">'+esc(e.message||'連線失敗')+'　請再按一次登入</div>';
    });
}

function enterCase(c){
  S.caseCode=c.code; S.caseName=c.name;
  $('login').classList.add('hidden'); $('picker').classList.add('hidden'); $('main').classList.remove('hidden');
  $('caseName').textContent=c.name;
  document.title='禹盛開發客資系統－'+c.name;
  $('whoLine').textContent=S.user.name+'（'+S.user.role+'）';
  $('list').innerHTML='<div class="load">載入中…</div>';
  applyPerm();

// ===================== 篩選 =====================
function buildFilters(){
  var f=[
    ['fStage','全部階段','客戶階段'],
    ['fGrade','全部等級','客戶等級'],
    ['fArea','全部區域','居住區域'],
    ['fMedia','全部媒體','媒體來源'],
    ['fDeal','全部成交','成交狀態']
  ];
  var h=f.map(function(x){
    return '<select id="'+x[0]+'" onchange="render()">'+opts(x[2],'',x[1])+'</select>';
  }).join('');
  var 業務=[...new Set(S.rows.map(function(r){return r['業務歸屬'];}).filter(Boolean))];
  if(S.user.role!=='業務'){
    h+='<select id="fOwner" onchange="render()"><option value="">全部業務</option>'+
       業務.sort().map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+
       '<option value="__none__">（未指派）</option></select>';
  }
  var keep={};
  ['fStage','fGrade','fArea','fMedia','fDeal','fOwner'].forEach(function(id){ var e=$(id); if(e) keep[id]=e.value; });
  $('filters').innerHTML=h;
  // 主管以上：階段篩選多一個「已作廢」
  if(S.user.canDispatch){
    var fs=$('fStage');
    if(fs) fs.innerHTML+='<option value="__void__">已作廢</option>';
  }
  Object.keys(keep).forEach(function(id){ var e=$(id); if(e) e.value=keep[id]; });
}
function setTab(t){
  closeModal();
  if(!$('detailView').classList.contains('hidden')) closeDetail();
  if(t!=='pend'){ S.sel=[]; S.selMode=false; var sb=$('selBtn'); if(sb) sb.textContent='批次改派'; }
  S.tab=t;
  document.querySelectorAll('.tab').forEach(function(e){ e.classList.toggle('on', e.dataset.tab===t); });
  var imp=(t==='imp'), cfg=(t==='cfg'), rev=(t==='rev'), rpt=(t==='rpt');
  var pend=(t==='pend');
  ['fGrade','fDeal','fOwner'].forEach(function(id){
    var e=$(id); if(!e) return;
    e.classList.toggle('hidden', pend);
    if(pend) e.value='';
  });
  var other=imp||cfg||rev||rpt;
  $('impView').classList.toggle('hidden', !imp);
  $('cfgView').classList.toggle('hidden', !cfg);
  $('revView').classList.toggle('hidden', !rev);
  $('rptView').classList.toggle('hidden', !rpt);
  $('listBody').classList.toggle('hidden', other);
  var sr=document.querySelector('.search-row'); if(sr) sr.classList.toggle('hidden', other);
  var ft=$('filters'); if(ft) ft.classList.toggle('hidden', other);
  if(cfg) loadCfg();
  if(rev) loadReview();
  if(rpt) initRpt();
  if(imp) fillQuick();
  if(!other) render();
}
function val(id){ var e=$(id); return e?e.value:''; }
function clearFilters(){
  ['fStage','fGrade','fArea','fMedia','fDeal','fOwner'].forEach(function(id){ var e=$(id); if(e) e.value=''; });
  $('kw').value='';
  render();
}

function render(){
  var kw=$('kw').value.trim().toLowerCase();
  var td=today();
  // 切到「已作廢」要向後端另外要資料
  var wantVoid=(val('fStage')==='__void__');
  if(wantVoid && !S.voidLoaded){
    S.voidLoaded=true;
    api({action:'getClients',includeVoid:true}).then(function(r){
      if(r.ok){ S.voidRows=r.rows; render(); }
    });
    $('list').innerHTML='<div class="load">載入已作廢客戶…</div>';
    return;
  }
  if(!wantVoid) S.voidLoaded=false;
  var src = wantVoid ? (S.voidRows||[]) : S.rows;
  var out=src.filter(function(r){
    if(S.tab==='due'){ var d=String(r['下次追蹤日']||''); if(!d||d>td||r['客戶階段']==='結案') return false; }
    if(S.tab==='pend'){ if(String(r['業務歸屬']||'').trim() || r['客戶階段']==='結案') return false; }
    if(kw){
      var hay=[r['客戶姓名'],r['主要電話'],r['相關聯絡人'],r['歷史背景'],r['介紹戶別'],r['_txt']].join(' ').toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    var m=[['fStage','客戶階段'],['fGrade','客戶等級'],['fArea','居住區域'],['fMedia','媒體來源'],['fDeal','成交狀態'],['fOwner','業務歸屬']];
    for(var i=0;i<m.length;i++){
      var v=val(m[i][0]);
      if(!v) continue;
      if(v==='__void__') continue;
      if(v==='__none__'){ if(String(r[m[i][1]]||'').trim()) return false; continue; }
      if(String(r[m[i][1]]||'').trim()!==v) return false;
    }
    return true;
  });
  // 各分頁用對應用途的排序
  if(S.tab==='due'){
    // 今日該追：最急的先（追蹤日早→晚）
    out.sort(function(a,b){
      var da=String(a['下次追蹤日']||'9999'), db=String(b['下次追蹤日']||'9999');
      if(da!==db) return da<db?-1:1;
      return String(a['最後互動日']||'')<String(b['最後互動日']||'')?-1:1;
    });
  } else if(S.tab==='pend'){
    // 待派工：放最久的先派（建檔日舊→新）
    out.sort(function(a,b){
      var da=String(a['建檔日']||'9999'), db=String(b['建檔日']||'9999');
      if(da!==db) return da<db?-1:1;
      return String(a['客戶ID']||'')<String(b['客戶ID']||'')?-1:1;
    });
  } else {
    // 全部客戶：剛動過的在最前（最後互動日新→舊）
    out.sort(function(a,b){
      var da=String(a['最後互動日']||''), db=String(b['最後互動日']||'');
      if(da!==db) return da>db?-1:1;
      return String(a['客戶姓名']||'')<String(b['客戶姓名']||'')?-1:1;
    });
  }
  // 篩選狀態
  var 名={fStage:'階段',fGrade:'等級',fArea:'區域',fMedia:'媒體',fDeal:'成交',fOwner:'業務'};
  var 用=[];
  Object.keys(名).forEach(function(id){
    var e=$(id); if(!e) return;
    var on=!!e.value;
    e.classList.toggle('on', on);
    if(on) 用.push(名[id]+'：'+(e.value==='__none__'?'未指派':e.value));
  });
  var kwOn=!!kw;
  var fb=$('fbar');
  if(fb){
    var show=用.length||kwOn;
    fb.classList.toggle('hidden', !show);
    if(show) $('fbarTxt').textContent='篩選中　'+(kwOn?'關鍵字：'+kw+(用.length?'　':''):'')+用.join('　');
  }
  $('count').textContent='共 '+out.length+' 位客戶'+(S.tab==='pend'&&S.user.canDispatch?'（點卡片勾選）':'');
  var pn=S.rows.filter(function(r){ return !String(r['業務歸屬']||'').trim() && r['客戶階段']!=='結案'; }).length;
  var pe=$('pendN'); if(pe) pe.textContent = pn? ' ('+pn+')' : '';
  drawBulk();
  $('list').innerHTML = out.length ? out.map(card).join('')
    : '<div class="empty">沒有符合條件的客戶</div>';
}

  var sel = (S.user.canDispatch && (S.tab==='pend' || S.selMode));

var TPL_COLS=['客戶姓名','主要電話','居住區域','媒體來源','購屋用途','客戶職業','年齡層','業務歸屬','歷史背景'];
function dlTpl(){

  var a=document.createElement('a');

  a.download='舊名單匯入範本.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function readCsv(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ $('bulkText').value=String(r.result||'').replace(/^\ufeff/,''); previewBulk(); };
  r.readAsText(f,'utf-8');
}
function splitCsvLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if((ch===','||ch==='\t')&&!q){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(function(x){ return x.trim(); });
}
function parseBulk(){
  var txt=$('bulkText').value.replace(/^\ufeff/,'').trim();
  if(!txt) return {err:'沒有資料'};
  var lines=txt.split(/\r?\n/).filter(function(x){ return x.trim(); });
  if(lines.length<2) return {err:'至少要有標題列與一筆資料'};
  var head=splitCsvLine(lines[0]);
  if(head.indexOf('客戶姓名')<0||head.indexOf('主要電話')<0)
    return {err:'標題列必須包含「客戶姓名」與「主要電話」。目前偵測到：'+head.join('、')};
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var p=splitCsvLine(lines[i]); var o={};
    head.forEach(function(k,j){ if(k) o[k]=p[j]||''; });
    if(String(o['主要電話']||'').trim()) rows.push(o);
  }
  return {head:head, rows:rows};
}
function previewBulk(){
  var r=parseBulk();
  var box=$('bulkPrev');
  if(r.err){ box.innerHTML='<div class="msg msg-err">'+esc(r.err)+'</div>'; return; }
  var un=r.head.filter(function(k){ return k && TPL_COLS.indexOf(k)<0; });
  box.innerHTML='<div class="msg msg-ok">偵測到 '+r.rows.length+' 筆、'+r.head.length+' 欄</div>'+
    (un.length?'<div class="hint">這些欄位會併入歷史背景：'+esc(un.join('、'))+'</div>':'')+
    '<div class="prev">'+r.rows.slice(0,5).map(function(o){
      return '<div class="prev-row"><b>'+esc(o['客戶姓名']||'(無名)')+'</b> '+esc(o['主要電話'])+
        ' <span>'+esc([o['居住區域'],o['媒體來源'],o['購屋用途']].filter(Boolean).join('・'))+'</span></div>';
    }).join('')+(r.rows.length>5?'<div class="hint">…共 '+r.rows.length+' 筆</div>':'')+'</div>'+
    '<button class="btn" onclick="doBulkImport()">確認匯入 '+r.rows.length+' 筆</button>';
}
function doBulkImport(){
  var r=parseBulk();
  if(r.err){ alert(r.err); return; }
  if(!confirm('要匯入 '+r.rows.length+' 筆舊名單？\n\n這批不會計入任何統計，全部歸為「未聯繫」。')) return;
  $('bulkPrev').innerHTML='<div class="msg">匯入中…請稍候</div>';
  api({action:'import',mode:'舊名單',list:r.rows}).then(function(res){
    if(!res.ok){ $('bulkPrev').innerHTML='<div class="msg msg-err">匯入失敗：'+esc(res.error||'')+'</div>'; return; }
    $('bulkPrev').innerHTML='<div class="msg msg-ok">已匯入 '+res.added+' 筆'+(res.skipped?'，略過重複或無效 '+res.skipped+' 筆':'')+'</div>';
    $('bulkText').value=''; reload();
  });
}

      '<label class="cbl"><input type="checkbox" id="pAll"'+(全?' checked':'')+' onchange="document.querySelectorAll(\'.pcase\').forEach(function(e){e.disabled=this.checked;if(this.checked)e.checked=false;}.bind(this))"> <b>全部案場</b>（含未來新增）</label>'+
      list.map(function(c){

function openEvent(mode){
  var c=S.cur.client;
  var 到場=(mode==='到場');
  var 來過=(S.cur.events||[]).some(function(e){var t=e['互動類型'];return t==='來人'||t==='回訪';});
  var 預期 = 到場 ? (來過?'回訪':'來人') : '追蹤聯繫';
  var 戶別=String(S.config['戶別清單']||'').split(/[,、]/).map(function(x){return x.trim();}).filter(Boolean);
  S.evUnits=String(c['介紹戶別']||'').split(/[,、]/).map(function(x){return x.trim();}).filter(Boolean);
  S.evUnitAll=戶別;
  function s(k,dic,lbl){
    return '<div class="field"><label>'+(lbl||k)+'</label><select id="m_'+k+'">'+
      opts(dic||k,c[k]||'','未填')+
      (c[k]?'<option value="__clear__">— 清空 —</option>':'')+
    '</select></div>';
  }
  modal(
    (到場?'記錄到場':'記錄聯繫')+' — '+esc(c['客戶姓名']||''),
    '系統會記為「'+預期+'」，日期固定為今天（不可修改）',
    '<div class="field"><label>客戶狀況 <span class="req">*</span></label>'+
      '<textarea id="mNote" rows="5" placeholder="'+(到場?'帶看哪幾戶、客戶反應、疑慮、下一步…':'聯繫內容、客戶回應、下一步…')+'"></textarea></div>'+
    (到場?'':'<div class="field"><label>聯繫結果</label><select id="mResult" onchange="evResult()">'+opts('聯繫結果','','請選擇')+'</select></div>'+
           '<div class="field hidden" id="mVisitBox"><label>約定到場日</label><input type="date" id="mVisit"></div>')+
    '<div class="sec-h">狀態（顯示目前紀錄，有變動再改）</div>'+
    '<div class="two">'+
      s('客戶等級')+s('成交狀態')+
    '</div>'+
    (到場?
      '<div class="sec-h">需求（顯示目前紀錄，有變動再改）</div>'+
      '<div class="two">'+
        s('需求房數')+s('需求地坪')+s('需求建坪')+s('需求車位')+s('預算範圍')+
      '</div>'+
      '<div class="field"><label>介紹戶別</label>'+
        (戶別.length?'<input type="text" id="evKw" placeholder="搜尋戶別" oninput="drawEvUnits()"><div id="evUnitBox" class="units"></div>'
                    :'<div class="hint">案場設定裡還沒填戶別清單</div>')+
      '</div>'+
      '<div class="field"><label>未購因素（可複選，客戶有疑慮或不考慮時填）</label>'+
        '<div id="evNoBox" class="units"></div></div>'
    :'')+
    (S.user.role!=='業務'?'<div class="field"><label>櫃檯指示（選填）</label><input type="text" id="mBoss" placeholder="對客資時的判斷與交辦"></div>':''),
    function(){
      var note=$('mNote').value.trim();
      if(!note){ alert('請填寫客戶狀況'); return false; }
      var p={action:'addEvent',cid:c['客戶ID'],mode:mode,note:note};
      var r=$('mResult'); if(r&&r.value) p.result=r.value;
      var vd=$('mVisit'); if(vd&&vd.value) p.visitDate=vd.value;
      var b=$('mBoss'); if(b&&b.value.trim()) p.boss=b.value.trim();
      var g=$('m_客戶等級'); if(g&&g.value&&g.value!=='__clear__') p.grade=g.value;
      var d=$('m_成交狀態'); if(d&&d.value&&d.value!=='__clear__') p.deal=d.value;
      // 需求欄位走 updClient
      var data={};
      ['需求房數','需求地坪','需求建坪','需求車位','預算範圍'].forEach(function(k){
        var e=$('m_'+k); if(!e) return;
        if(e.value==='__clear__') data[k]='';
        else if(e.value) data[k]=e.value;
      });
      if(到場){
        data['介紹戶別']=(S.evUnits||[]).join('、');
        if((S.evNo||[]).length) data['未購因素']=(S.evNo||[]).join('、');
      }
      api(p).then(function(res){
        if(!res.ok){ alert('儲存失敗：'+(res.error||'')); return; }
        var after=function(){ closeModal(); openDetail(c['客戶ID']); reload(); };
        if(Object.keys(data).length) api({action:'updClient',cid:c['客戶ID'],data:data}).then(after);
        else after();
      });
      return 'wait';
    }
  );
  S.evNo=String(c['未購因素']||'').split(/[,、]/).map(function(x){return x.trim();}).filter(Boolean);
  if(到場){ drawEvUnits(); drawEvNo(); }
}

  box.innerHTML=list.length? list.map(function(u){
    var on=(S.evUnits||[]).indexOf(u)>=0;
    return '<button type="button" class="unit'+(on?' on':'')+'" onclick="tapEvUnit(\''+u+'\')">'+esc(u)+'</button>';
  }).join('') : '<div class="hint">找不到戶別</div>';
}
function tapEvUnit(u){
  var i=(S.evUnits||[]).indexOf(u);
  if(i>=0) S.evUnits.splice(i,1); else S.evUnits.push(u);
  drawEvUnits();
}
function drawEvNo(){
  var box=$('evNoBox'); if(!box) return;
  var a=S.dict['未購因素']||[];
  box.innerHTML=a.map(function(o){
    var on=(S.evNo||[]).indexOf(o.name)>=0;
    return '<button type="button" class="unit'+(on?' on':'')+'" onclick="tapEvNo(\''+o.name+'\')">'+esc(o.name)+'</button>';

function tapEvNo(n){
  var i=(S.evNo||[]).indexOf(n);

}

function drawNNo(){

function tapNNo(n){

function toggleNoPhone(){
  var box=$('noPhoneBox'); if(!box) return;
  var 開=box.classList.contains('hidden');
  box.classList.toggle('hidden', !開);
  var req=$('phReq'); if(req) req.style.visibility = 開?'hidden':'visible';
  if(開){ $('nNoPhone').focus(); } else { $('nNoPhone').value=''; }
  dupCheck();
}
function normPhone(v){
  var s=String(v||'').trim(), ext='';
  var em=s.match(/[#＃]\s*(\d+)\s*$/); if(em){ ext=em[1]; s=s.slice(0,em.index); }
  s=s.replace(/[^\d]/g,'');
  if(s.indexOf('886')===0&&s.length>=11) s='0'+s.slice(3);
  if(s.length>=8&&s.length<=9&&s.charAt(0)!=='0') s='0'+s;
  return ext? s+'#'+ext : s;
}
function basePhone(v){ return normPhone(v).split('#')[0]; }
function dupCheck(){
  var box=$('dupBox'); if(!box) return;
  var ph=basePhone($('nPhone').value);
  S.dupHit=null;
  var 無電話模式=$('noPhoneBox') && !$('noPhoneBox').classList.contains('hidden');
  if(ph.length<8){
    box.innerHTML='';
    // 無電話時改用姓名比對，只提示不擋
    if(無電話模式){
      var nm=String(($('nName')||{}).value||'').trim();
      if(nm.length>=2){
        var 同名=S.rows.filter(function(r){ return String(r['客戶姓名']||'').indexOf(nm)>=0; }).slice(0,3);
        if(同名.length){
          box.innerHTML='<div class="dup dup-warn"><b>有同名客戶，請確認是不是同一位</b>'+
            同名.map(function(r){
              return esc(r['客戶姓名'])+'・'+esc(r['客戶階段']||'')+'・'+esc(r['業務歸屬']||'未指派')+
                '<button type="button" class="btn btn-sm btn-ghost" onclick="closeModal();openDetail(\''+r['客戶ID']+'\')">開啟</button>';
            }).join('<br>')+
            '<br>不同人的話直接建立即可。</div>';
        }
      }
    }
    return;
  }
  var main=null, ct=null;
  S.rows.forEach(function(r){
    if(basePhone(r['主要電話'])===ph){ main=r; }
    else if(!ct && String(r['相關聯絡人']||'').split(/[,、;\n]/).some(function(x){ return x && basePhone(x)===ph; })){ ct=r; }
  });
  if(main){
    S.dupHit={type:'main',r:main};
    var 歸=String(main['業務歸屬']||'').trim();
    var 別人的 = !S.user.canSeeAll && 歸 && 歸!==S.user.name;
    if(別人的){
      box.innerHTML='<div class="dup dup-warn"><b>這位客戶已經是 '+esc(歸)+' 的</b>'+
        esc(main['客戶姓名']||'')+'・'+esc(main['客戶階段']||'')+
        '<br>如果你也接待了同一位客戶，記錄下來系統會標示撞客，由主管判定歸屬。'+
        '<button type="button" class="btn btn-sm" onclick="alsoServed(\''+main['客戶ID']+'\',\''+esc(main['客戶姓名']||'')+'\')">我也接待了</button></div>';
    } else {
      box.innerHTML='<div class="dup dup-block"><b>此電話已建檔</b>'+esc(main['客戶姓名']||'')+'・'+esc(main['客戶階段']||'')+
        '・'+esc(歸||'未指派')+
        '<button type="button" class="btn btn-sm" onclick="closeModal();openDetail(\''+main['客戶ID']+'\')">開啟</button></div>';
    }
  } else if(ct){
    S.dupHit={type:'contact',r:ct};
    box.innerHTML='<div class="dup dup-warn"><b>這是既有客戶的相關聯絡人</b>'+esc(ct['客戶姓名']||'')+'・'+esc(ct['業務歸屬']||'未指派')+
      '<br>可以建成獨立客戶，兩邊會自動建立關聯。'+
      '<button type="button" class="btn btn-sm btn-ghost" onclick="closeModal();openDetail(\''+ct['客戶ID']+'\')">開啟原客戶</button></div>';
  } else {
    box.innerHTML='<div class="dup dup-ok">新客戶</div>';
  }
}
function alsoServed(cid,name){
  var mode=S.newMode||'來電';
  modal('記錄接觸 — '+esc(name),'這位客戶目前屬於其他業務，你的紀錄會讓系統標示撞客',
    '<div class="field"><label>你這次的接觸情形 <span class="req">*</span></label>'+
      '<textarea id="asNote" rows="5" placeholder="'+(mode==='來人'?'客人來現場、你怎麼接待的…':'客人打電話進來、談了什麼…')+'"></textarea></div>'+
    '<div class="hint">系統會記為「'+(mode==='來人'?'來人':'追蹤聯繫')+'」，並在客戶卡片標示撞客，由主管判定歸屬。</div>',
    function(){
      var note=$('asNote').value.trim();
      if(!note){ alert('請填寫接觸情形'); return false; }
      api({action:'addEvent',cid:cid,mode:(mode==='來人'?'到場':'追蹤'),note:note}).then(function(r){
        if(!r.ok){ alert('儲存失敗：'+(r.error||'')); return; }
        closeModal();
        alert('已記錄。系統已標示撞客，主管會在對客資時處理歸屬。');
        reload();
      });
      return 'wait';
    }
  );
}
function serverDup(){
  var box=$('dupBox'); if(!box) return;
  var ph=basePhone(($('nPhone')||{}).value||'');
  if(ph.length<8) return;
  if(S.dupHit && S.dupHit.type==='main') return;   // 本地已抓到就不用再問
  var 原=box.innerHTML;
  box.innerHTML='<div class="dup dup-chk">查詢中…</div>';
  api({action:'checkPhone',phone:ph}).then(function(r){
    if(!r || !r.ok){ box.innerHTML=原; return; }
    // 使用者可能已經改了號碼，確認還是同一支才顯示
    if(basePhone(($('nPhone')||{}).value||'')!==ph) return;
    if(!r.hit){ box.innerHTML='<div class="dup dup-ok">新客戶</div>'; S.dupHit=null; return; }
    var c=r.client, 歸=c['業務歸屬']||'未指派';
    if(r.hitType==='contact'){
      S.dupHit={type:'contact', r:{'客戶ID':c['客戶ID'],'客戶姓名':c['客戶姓名'],'業務歸屬':歸}};
      box.innerHTML='<div class="dup dup-warn"><b>這是既有客戶的相關聯絡人</b>'+
        esc(c['客戶姓名']||'')+'・'+esc(歸)+
        '<br>可以建成獨立客戶，兩邊會自動建立關聯。</div>';
      return;
    }
    if(r.別人的){
      S.dupHit={type:'other', r:{'客戶ID':c['客戶ID'],'客戶姓名':c['客戶姓名'],'業務歸屬':歸}};
      box.innerHTML='<div class="dup dup-warn"><b>這位客戶已經是 '+esc(歸)+' 的</b>'+
        esc(c['客戶姓名']||'')+'・'+esc(c['客戶階段']||'')+
        '<br>如果你也接待了同一位客戶，記錄下來系統會標示撞客，由主管判定歸屬。'+
        '<button type="button" class="btn btn-sm" onclick="alsoServed(\''+c['客戶ID']+'\',\''+esc(c['客戶姓名']||'')+'\')">我也接待了</button></div>';
      return;
    }
    S.dupHit={type:'main', r:{'客戶ID':c['客戶ID'],'客戶姓名':c['客戶姓名'],'業務歸屬':歸,'客戶階段':c['客戶階段']}};
    box.innerHTML='<div class="dup dup-block"><b>此電話已建檔</b>'+
      esc(c['客戶姓名']||'')+'・'+esc(c['客戶階段']||'')+'・'+esc(歸)+
      '<button type="button" class="btn btn-sm" onclick="closeModal();openDetail(\''+c['客戶ID']+'\')">開啟</button></div>';
  }).catch(function(){ box.innerHTML=原; });
}
function submitNew(){
  var mode=S.newMode||'來電';
  var ph=$('nPhone').value.trim(), nm=$('nName').value.trim();
  var 無電話模式=$('noPhoneBox') && !$('noPhoneBox').classList.contains('hidden');
  var 原因=無電話模式 ? $('nNoPhone').value.trim() : '';
  if(!nm){ alert('請填寫客戶姓名'); return false; }
  if(!ph){
    if(!無電話模式){ alert('請填寫電話。真的沒有電話，請點電話欄旁的「沒有電話？」說明原因'); return false; }
    if(!原因){ alert('請說明未留電話的原因'); return false; }
  }
  if(S.dupHit && S.dupHit.type==='main'){ alert('此電話已建檔，請直接開啟該客戶'); return false; }
  if(S.dupHit && S.dupHit.type==='other'){
    alert('這位客戶已經是 '+(S.dupHit.r['業務歸屬']||'')+' 的。\n\n如果你也接待了同一位客戶，請按「我也接待了」記錄，由主管判定歸屬。');
    return false;
  }
  var need=[['nArea','居住區域'],['nMedia','媒體來源'],['nMotive','購屋用途']];
  if(mode==='來人'){
    need=need.concat([['nAge','年齡層'],['nJob','客戶職業'],['nGrade','客戶等級'],
      ['nRoom','需求房數'],['nLand','需求地坪'],['nBuild','需求建坪'],['nPark','需求車位'],['nBudget','預算範圍']]);
  }
  var miss=need.filter(function(x){ var e=$(x[0]); return !e||!e.value; }).map(function(x){ return x[1]; });
  var note=$('nNote').value.trim();
  if(mode==='來人' && !note) miss.push('客戶狀況');
  if(miss.length){ alert('請填寫：\n'+miss.join('、')); return false; }
  function g(id){ var e=$(id); return e?e.value:''; }
  var link = (S.dupHit && S.dupHit.type==='contact') ? S.dupHit.r['客戶ID'] : '';
  api({action:'addClient',mode:mode,force:!!link,linkFrom:link,phone:ph,name:nm,noPhoneReason:原因,
       area:g('nArea'),media:g('nMedia'),motive:g('nMotive'),
       age:g('nAge'),job:g('nJob'),note:note,assignee:'',
       grade:g('nGrade'),room:g('nRoom'),land:g('nLand'),
       build:g('nBuild'),park:g('nPark'),budget:g('nBudget'),
       deal:g('nDeal'),unit:(S.nUnits||[]).join('、'),noReason:(S.nNo||[]).join('、')})
  .then(function(res){
    if(res.exists){
      alert('此電話已建檔\n\n'+(res.client['客戶姓名']||'')+'　'+(res.client['客戶階段']||''));
      closeModal(); openDetail(res.client['客戶ID']); return;
    }
    if(!res.ok){ alert('建立失敗：'+(res.error||'')); return; }
    // 先關視窗再處理後續，避免任何一步失敗就卡在「儲存中…」
    closeModal();
    if(link){
      api({action:'link',cidA:res.cid,cidB:link}).catch(function(){});
    }
    reload();
    openDetail(res.cid);
  }).catch(function(){
    closeModal();
    alert('建立時連線出問題，請到「全部客戶」搜尋電話確認是否已建立');
  });
  return 'wait';
}
function staffOpts(){
  return staffList().map(function(n){return '<option>'+esc(n)+'</option>';}).join('');
}

// ===================== 編輯 =====================
function openEdit(){
  var c=S.cur.client;
  function f(k,type){ return '<div class="field"><label>'+k+'</label><input type="'+(type||'text')+'" id="e_'+k+'" value="'+esc(c[k]||'')+'"></div>'; }
  function s(k,dic){ return '<div class="field"><label>'+k+'</label><select id="e_'+k+'">'+opts(dic||k,c[k]||'','未填')+'</select></div>'; }
  var 戶別=String(S.config['戶別清單']||'').split(/[,、]/).map(function(x){return x.trim();}).filter(Boolean);
  var 已選=String(c['介紹戶別']||'').split(/[,、]/).map(function(x){return x.trim();}).filter(Boolean);
  modal('編輯客戶資料','改的是客戶目前的資料；已報出去的統計數字不會變動',
    '<div class="sec-h" style="margin-top:0">基本</div>'+
    '<div class="two">'+f('客戶姓名')+f('主要電話','tel')+'</div>'+
    '<div class="field"><label>相關聯絡人</label><div id="ctList"></div>'+
      '<button class="btn btn-ghost btn-sm" onclick="addCt()" type="button">＋ 新增聯絡人</button></div>'+
    '<div class="sec-h">客戶輪廓</div>'+
    '<div class="two">'+s('居住區域')+f('居住地址')+s('客戶職業')+s('年齡層')+s('媒體來源')+s('購屋用途')+f('電子郵件','email')+'</div>'+
    '<div class="sec-h">需求</div>'+
    '<div class="two">'+s('需求房數')+s('需求地坪')+s('需求建坪')+s('需求車位')+s('預算範圍')+'</div>'+
    '<div class="field"><label>介紹戶別</label><input type="text" id="unitKw" placeholder="搜尋戶別" oninput="drawUnits()">'+
      '<div id="unitBox" class="units"></div></div>'+
    '<div class="sec-h">狀態（顯示目前紀錄，有變動再改）</div>'+
    '<div class="two">'+s('客戶等級')+s('成交狀態')+f('約定到場日','date')+'</div>',
    function(){
      var keys=['客戶姓名','主要電話','居住區域','居住地址','客戶職業','年齡層',
        '媒體來源','購屋用途','電子郵件','需求房數','需求地坪','需求建坪','需求車位','預算範圍',
        '客戶等級','成交狀態','約定到場日'];
      var data={};
      keys.forEach(function(k){ var e=$('e_'+k); if(e) data[k]=e.value; });
      if(String(c['主要電話']||'').trim() && !String(data['主要電話']||'').trim()){
        alert('已經有電話的客戶不可清空電話');
        return false;
      }
      if(!String(data['客戶姓名']||'').trim()){ alert('客戶姓名不可空白'); return false; }
      data['相關聯絡人']=collectCt();
      data['介紹戶別']=S.units.join('、');
      api({action:'updClient',cid:c['客戶ID'],data:data}).then(function(res){
        if(!res.ok){ alert('儲存失敗：'+(res.error||'')); return; }
        closeModal(); openDetail(c['客戶ID']); reload();
      });
      return 'wait';
    }
  );
  S.units=已選; S.unitAll=戶別;
  var 現有=String(c['相關聯絡人']||'').split('\n').filter(Boolean);
  S.cts = 現有.length ? 現有.map(function(line){
    var p=line.split('/').map(function(x){return x.trim();});
    return {name:p[0]||'', rel:p[1]||'', tel:p[2]||''};
  }) : [];
  drawCt(); drawUnits();
}
function drawCt(){
  var box=$('ctList'); if(!box) return;
  box.innerHTML=S.cts.map(function(x,i){
    return '<div class="ct-row">'+
      '<input type="text" placeholder="姓名" value="'+esc(x.name)+'" oninput="S.cts['+i+'].name=this.value">'+
      '<input type="text" placeholder="關係" value="'+esc(x.rel)+'" oninput="S.cts['+i+'].rel=this.value">'+
      '<input type="tel" placeholder="電話" value="'+esc(x.tel)+'" oninput="S.cts['+i+'].tel=this.value">'+
      '<button class="ct-x" type="button" onclick="delCt('+i+')">✕</button></div>';
  }).join('') || '<div class="hint">還沒有其他聯絡人</div>';
}
function addCt(){ S.cts.push({name:'',rel:'',tel:''}); drawCt(); }
function delCt(i){ S.cts.splice(i,1); drawCt(); }
function collectCt(){
  return S.cts.filter(function(x){ return x.name||x.tel; })
    .map(function(x){ return [x.name,x.rel,x.tel].join(' / '); }).join('\n');
}
function drawUnits(){
  var box=$('unitBox'); if(!box) return;
  var kw=($('unitKw')||{}).value||'';
  var list=S.unitAll.filter(function(u){ return !kw || u.toLowerCase().indexOf(kw.toLowerCase())>=0; });
  box.innerHTML=list.length ? list.map(function(u){
    var on=S.units.indexOf(u)>=0;
    return '<button type="button" class="unit'+(on?' on':'')+'" onclick="tapUnit(\''+u+'\')">'+esc(u)+'</button>';
  }).join('') : '<div class="hint">找不到戶別</div>';
}
function tapUnit(u){
  var i=S.units.indexOf(u);
  if(i>=0) S.units.splice(i,1); else S.units.push(u);
  drawUnits();
}

// ===================== 彈窗 =====================
function modal(title,sub,body,onOk){
  $('modal').innerHTML=
    '<div class="mask" onclick="if(event.target===this)closeModal()"><div class="sheet">'+
      '<h2>'+title+'</h2><div class="sub">'+sub+'</div>'+body+
      '<div class="sheet-acts"><button class="btn btn-ghost" onclick="closeModal()">取消</button>'+
      '<button class="btn" id="mOk">儲存</button></div>'+
    '</div></div>';
  $('mOk').onclick=function(){
    var r=onOk();
    if(r==='wait'){ $('mOk').disabled=true; $('mOk').textContent='儲存中…'; }
  };
}
function closeModal(){ $('modal').innerHTML=''; }
</script>
